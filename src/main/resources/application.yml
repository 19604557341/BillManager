# src/main/resources/application.yml

spring:
  application:
    name: BillManager
  # 加载项目根目录的 .env（已被 gitignore 排除）；系统环境变量 DB_PASSWORD 优先级更高，生产环境直接用环境变量即可。
  # optional: 前缀保证没有 .env 时不报错，此时若 DB_PASSWORD 也未设置，会因占位符无法解析而快速失败。
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: jdbc:mysql://localhost:3306/bill_manager?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  devtools:
    restart:
      enabled: true
      additional-paths:
        - src/main/java/com/example/billmanager
      exclude: static/**

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    root: INFO
    com.example.billmanager: DEBUG